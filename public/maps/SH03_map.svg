t-family="Arial, Helvetica, sans-serif">eyes ABOVE the lens</text><circle cx="205" cy="470" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="205" y1="470" x2="205.0" y2="436.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="205.0,436.0 210.2,446.8 199.8,446.8" fill="#2f3f8f"/><text x="15" y="510" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="15" y="526" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">picks his case up off</text><text x="15" y="541" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the gravel by the rear wheel</text><circle cx="250" cy="470" r="13" fill="#9b3b2b" stroke="#fff" stroke-width="2"/><line x1="250" y1="470" x2="250.0" y2="436.0" stroke="#9b3b2b" stroke-width="5"/><polygon points="250.0,436.0 255.2,446.8 244.8,446.8" fill="#9b3b2b"/><text x="270" y="508" font-size="12" fill="#9b3b2b" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL WOMAN, RUST VEST</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-