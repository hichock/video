" cy="310" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="422" y1="310" x2="422.0" y2="276.0" stroke="#b88a45" stroke-width="5"/><polygon points="422.0,276.0 427.2,286.8 416.8,286.8" fill="#b88a45"/><text x="448" y="350" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="448" y="366" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">asks “This is the room?”</text><text x="448" y="381" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">eyes on her</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><clipPath id="frameclip"><rect x="760" y="60" width="300" height="533"/></clipPath><g clip-path="url(#frameclip)"><rect x="862" y="124" width="96" height="181" fill="#efe7da" fill-opacity="0.85" stroke="#1b2324"/><rect x="1012" y="140" width="48" height="346" fill="#ffffff" fill-opacity="0.85" stroke="#1b2324"/><circle cx="850" cy="220" r="36" fill="#b88a45"/><rect x="799" y="261" width="102" height="384" rx="4" fill="#b88a45"/><circle cx="964" cy="241" r="34" fill="#5d93bd"/><rect x="916" y="280" width="96" height="373" rx="4" fill="#5d93bd"/></g><text x="910" y="140" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#efe7da" stroke-width="4">CORRIDOR → LANDING</text><text x="1036" y="156" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">OPEN DOOR</text><text x="850" y="458" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL (waist-up)</text><text x="964" y="487" font-size="11" fill="#5d93bd" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">ICE-BLUE (looks right)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Level with the doorway on the RIGHT.</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">She looks into it (to her left = frame-right)</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">while still walking toward camera.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH10 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NAOMI: “This is the room?” — Clara: “My mother said…”</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Same reverse corridor view, a few steps later</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Both keep walking north toward the camera; nobody stops.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Dialogue: the taller woman first, then the copper-haired woman.</text>
</svg>