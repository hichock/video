text><line x1="80" y1="265" x2="80" y2="345" stroke="#6f8fb8" stroke-width="7"/><text x="8" y="300" font-size="11" fill="#667073" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WINDOW</text><rect x="354" y="270" width="12" height="60" fill="#ffffff" stroke="#1b2324"/><path d="M360 270 A60 60 0 0 0 300 330" fill="none" stroke="#667073" stroke-dasharray="4 4"/><text x="300" y="262" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">NURSERY DOOR</text><rect x="86" y="390" width="62" height="200" rx="3" fill="#ffffff" stroke="#1b2324"/><text x="117" y="500" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">BED</text><text x="117" y="404" font-size="10" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">foot</text><rect x="86" y="592" width="34" height="24" fill="#b08a62" stroke="#1b2324"/><circle cx="103" cy="604" r="6" fill="#f2b632"/><text x="124" y="590" font-size="10" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">lamp</text><rect x="306" y="572" width="46" height="42" rx="6" fill="#ffffff" stroke="#1b2324"/><text x="329" y="566" font-size="10" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">armchair</text><rect x="170" y="360" width="160" height="200" fill="none" stroke="#667073" stroke-dasharray="5 4"/><rect x="215" y="430" width="60" height="40" fill="#5b3f2a" stroke="#1b2324"/><text x="245" y="455" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">CHEST</text><circle cx="92" cy="262" r="7" fill="#c1302a"/><text x="102" y="244" font-size="11" fill="#c1302a" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NURSERY FIXED corner</text><polygon points="400,170 606,592 194,592" fi