eld raised</text><circle cx="404" cy="282" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="404" y1="282" x2="404.0" y2="316.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="404.0,316.0 398.8,305.2 409.2,305.2" fill="#2f3f8f"/><text x="430" y="276" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="430" y="292" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">in the corridor, crossing</text><text x="430" y="307" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the doorway gap</text><circle cx="404" cy="214" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="404" y1="214" x2="404.0" y2="248.0" stroke="#b88a45" stroke-width="5"/><polygon points="404.0,248.0 398.8,237.2 409.2,237.2" fill="#b88a45"/><text x="430" y="204" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="430" y="220" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">a few steps behind him</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><clipPath id="frameclip"><rect x="760" y="60" width="300" height="533"/></clipPath><g clip-path="url(#frameclip)"><rect x="760" y="209" width="60" height="330" fill="#ffffff" fill-opacity="0.85" stroke="#1b2324"/><rect x="772" y="103" width="60" height="96" fill="#6f8fb8" fill-opacity="0.85" stroke="#1b2324"/><rect x="880" y="412" width="60" height="53" fill="#5b3f2a" fill-opacity="0.85" stroke="#1b2324"/><rect x="994" y="135" width="60" height="245" fill="#ffffff" fill-opacity="0.85" stroke="#1b2324"/><circle cx="1039" cy="167" r="5" fill="#2f3f8f"/><rect x="1034" y="170" width="9" height="43" rx="4" fill="#2f3f8f"/><circle cx="1012" cy="188" r="9" fill="#6b7a3a"/><rect x="998" y="199" width="27" height="171" rx="4" fill="#6b7a3a"/><circle cx="820" cy="113" r="10" fill="#9b3b2b"/><rect x="805" y="125" width="30" height="139" rx="4" fill="#9b3b2b"/></g><text x="790" y="225" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BED</text><text x="802" y="119" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#6f8fb8" stroke-width="4">WINDOW</text><text x="910" y="428" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#5b3f2a" stroke-width="4">CHEST + BOX</text><text x="1024" y="151" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">DOORWAY</text><text x="1012" y="393" font-size="11" fill="#6b7a3a" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">OLIVE</text><text x="820" y="286" font-size="11" fill="#9b3b2b" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">RUST (on stool)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">REVERSE of SH13: from the far end of the</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">room. Small woman upper-left in the</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">corner; tall man in the doorway RIGHT;</text><text x="760" y="681" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the others pass in the corridor beyond.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH14 — FIRST FRAME ONLY: start positions and facing — not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">First frame: from the far end of the nursery — the woman in the corner, the man in the doorway (MWS, 28mm)</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Inside the nursery, far end, looking back</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">SH13 looks at the corner from the doorway; this is its reverse, so the cut changes the view completely.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Through the doorway the bearded man crosses left to right (toward the landing).</text>
