<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="902" viewBox="0 0 1160 902">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(20,40)"><rect x="0" y="0" width="660" height="760" fill="#e6e1d8"/><text x="330" y="40" font-size="18" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE HALL (north up)</text><rect x="200" y="180" width="400" height="420" fill="#efe8dc" stroke="#1b2324" stroke-width="3"/><rect x="60" y="330" width="140" height="90" fill="#efe8dc" stroke="#1b2324" stroke-width="2"/><text x="130" y="316" font-size="12" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">short passage</text><rect x="52" y="345" width="16" height="60" fill="#ffffff" stroke="#1b2324"/><text x="60" y="450" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE DOOR</text><text x="60" y="466" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">← entrance hall</text><line x1="300" y1="180" x2="380" y2="180" stroke="#6f8fb8" stroke-width="7"/><text x="340" y="170" font-size="11" fill="#667073" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL HIGH WINDOW</text><polygon points="300,184 380,184 470,330 390,330" fill="#bcd0e6" fill-opacity="0.45"/><text x="392" y="250" font-size="11" fill="#4f6f95" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">cold shaft of daylight</text><rect x="586" y="320" width="14" height="100" fill="#5b3f2a" stroke="#1b2324"/><text x="578" y="300" font-size="13" fill="#1b2324" text-anchor="end" font-weight="700" font-family="Arial, Helvetica, sans-serif">BELL BOARD</text><text x="578" y="314" font-size="11" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">NURSERY in the middle row</text><rect x="572" y="350" width="12" height="40" fill="#8a6a45" stroke="#1b2324"/><rect x="592" y="440" width="16" height="60" fill="#8a6a45" stroke="#1b2324"/><text x="582" y="526" font-size="12" fill="#1b2324" text-anchor="end" font-weight="700" font-family="Arial, Helvetica, sans-serif">LOWER SERVICE DOOR</text><text x="582" y="542" font-size="11" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">→ back stair</text><circle cx="566" cy="336" r="5" fill="#f2b632"/><text x="330" y="640" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">the lower wooden panel is under the board at knee height</text><text x="330" y="656" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">night: one bare bulb above the board</text><polygon points="520,414 590,367 603,429" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><g transform="translate(520,414) rotate(-12)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="160" y="474" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">HANDHELD 35mm, behind his RIGHT shoulder</text><circle cx="560" cy="386" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="560" y1="386" x2="594.0" y2="386.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="594.0,386.0 583.2,391.2 583.2,380.8" fill="#2f3f8f"/><text x="240" y="496" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="240" y="512" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">square to the board; finger on</text><text x="240" y="527" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the NURSERY flag, not yet pressing</text><circle cx="556" cy="312" r="13" fill="#9b3b2b" stroke="#fff" stroke-width="2"/><line x1="556" y1="312" x2="580.0416305603426" y2="336.04163056034264" stroke="#9b3b2b" stroke-width="5"/><polygon points="580.0416305603426,336.04163056034264 568.7,332.1 576.1,324.7" fill="#9b3b2b"/><text x="276" y="272" font-size="12" fill="#9b3b2b" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL WOMAN, RUST VEST</text><text x="276" y="288" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">left of the board, tightening</text><text x="276" y="303" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the camera on its clamp</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><clipPath id="frameclip"><rect x="760" y="60" width="300" height="533"/></clipPath><g clip-path="url(#frameclip)"><rect x="850" y="124" width="138" height="203" fill="#5b3f2a" fill-opacity="0.85" stroke="#1b2324"/><rect x="1012" y="167" width="48" height="320" fill="#8a6a45" fill-opacity="0.85" stroke="#1b2324"/><circle cx="808" cy="199" r="15" fill="#9b3b2b"/><rect x="787" y="215" width="42" height="266" rx="4" fill="#9b3b2b"/><circle cx="970" cy="241" r="36" fill="#2f3f8f"/><rect x="919" y="282" width="102" height="320" rx="4" fill="#2f3f8f"/></g><text x="919" y="140" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#5b3f2a" stroke-width="4">BELL BOARD · NURSERY</text><text x="1036" y="183" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#8a6a45" stroke-width="4">LOWER DOOR</text><text x="808" y="496" font-size="11" fill="#9b3b2b" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">RUST (3/4)</text><text x="970" y="416" font-size="11" fill="#2f3f8f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BEARDED (back 3/4, right profile)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">MEDIUM, over his RIGHT shoulder.</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">NURSERY label readable above his finger.</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Small woman frame-LEFT at her clamp.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH20 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">Owen lowers and resets the NURSERY flag: “The wiring’s dead…” (MS, 35mm)</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Service hall, closer: behind his right shoulder</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Change of size (WS → INSERT → MS) around one board keeps the cuts from jumping.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Her camera on its clamp is left of the board, facing it = BELL BOARD FIXED.</text>
</svg>