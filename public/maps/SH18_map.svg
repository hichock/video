<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="902" viewBox="0 0 1160 902">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(20,40)"><rect x="0" y="0" width="660" height="760" fill="#e6e1d8"/><text x="330" y="40" font-size="18" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE HALL (north up)</text><rect x="200" y="180" width="400" height="420" fill="#efe8dc" stroke="#1b2324" stroke-width="3"/><rect x="60" y="330" width="140" height="90" fill="#efe8dc" stroke="#1b2324" stroke-width="2"/><text x="130" y="316" font-size="12" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">short passage</text><rect x="52" y="345" width="16" height="60" fill="#ffffff" stroke="#1b2324"/><text x="60" y="450" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE DOOR</text><text x="60" y="466" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">← entrance hall</text><line x1="300" y1="180" x2="380" y2="180" stroke="#6f8fb8" stroke-width="7"/><text x="340" y="170" font-size="11" fill="#667073" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL HIGH WINDOW</text><polygon points="300,184 380,184 470,330 390,330" fill="#bcd0e6" fill-opacity="0.45"/><text x="392" y="250" font-size="11" fill="#4f6f95" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">cold shaft of daylight</text><rect x="586" y="320" width="14" height="100" fill="#5b3f2a" stroke="#1b2324"/><text x="578" y="300" font-size="13" fill="#1b2324" text-anchor="end" font-weight="700" font-family="Arial, Helvetica, sans-serif">BELL BOARD</text><text x="578" y="314" font-size="11" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">NURSERY in the middle row</text><rect x="572" y="350" width="12" height="40" fill="#8a6a45" stroke="#1b2324"/><rect x="592" y="440" width="16" height="60" fill="#8a6a45" stroke="#1b2324"/><text x="582" y="526" font-size="12" fill="#1b2324" text-anchor="end" font-weight="700" font-family="Arial, Helvetica, sans-serif">LOWER SERVICE DOOR</text><text x="582" y="542" font-size="11" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">→ back stair</text><circle cx="566" cy="336" r="5" fill="#f2b632"/><text x="330" y="640" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">the lower wooden panel is under the board at knee height</text><text x="330" y="656" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">night: one bare bulb above the board</text><polygon points="230,380 593,211 593,549" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><line x1="230" y1="380" x2="262" y2="380" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"/><polygon points="262,380 253.0,384.3 253.0,375.7" fill="#000000"/><g transform="translate(230,380) rotate(0)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="30" y="510" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 35mm, passage entrance, drifts in</text><circle cx="556" cy="382" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="556" y1="382" x2="590.0" y2="382.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="590.0,382.0 579.2,387.2 579.2,376.8" fill="#2f3f8f"/><text x="326" y="562" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="326" y="578" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">at the board, about to crouch;</text><text x="326" y="593" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">panel still CLOSED</text><circle cx="512" cy="350" r="13" fill="#6b7a3a" stroke="#fff" stroke-width="2"/><line x1="512" y1="350" x2="545.4834636024151" y2="355.90403804067563" stroke="#6b7a3a" stroke-width="5"/><polygon points="545.4834636024151,355.90403804067563 533.9,359.2 535.7,348.9" fill="#6b7a3a"/><text x="342" y="420" font-size="12" fill="#6b7a3a" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL MAN, OLIVE JACKET</text><text x="342" y="436" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">behind his LEFT shoulder,</text><text x="342" y="451" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">handheld on the panel</text><circle cx="430" cy="214" r="13" fill="#9b3b2b" stroke="#fff" stroke-width="2"/><line x1="430" y1="214" x2="430.0" y2="180.0" stroke="#9b3b2b" stroke-width="5"/><polygon points="430.0,180.0 435.2,190.8 424.8,190.8" fill="#9b3b2b"/><text x="200" y="228" font-size="12" fill="#9b3b2b" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL WOMAN, RUST VEST</text><text x="200" y="244" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">sets the monitor case down</text><text x="200" y="259" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">by the left (north) wall</text><circle cx="350" cy="262" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="350" y1="262" x2="383.4834636024151" y2="267.90403804067563" stroke="#b88a45" stroke-width="5"/><polygon points="383.4834636024151,267.90403804067563 371.9,271.2 373.7,260.9" fill="#b88a45"/><text x="200" y="322" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="200" y="338" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">behind her, nearer camera</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><clipPath id="frameclip"><rect x="760" y="60" width="300" height="533"/></clipPath><g clip-path="url(#frameclip)"><rect x="898" y="167" width="90" height="160" fill="#5b3f2a" fill-opacity="0.85" stroke="#1b2324"/><rect x="916" y="337" width="54" height="53" fill="#8a6a45" fill-opacity="0.85" stroke="#1b2324"/><rect x="1000" y="177" width="42" height="266" fill="#8a6a45" fill-opacity="0.85" stroke="#1b2324"/><rect x="778" y="71" width="78" height="53" fill="#6f8fb8" fill-opacity="0.85" stroke="#1b2324"/><circle cx="940" cy="241" r="8" fill="#2f3f8f"/><rect x="928" y="251" width="24" height="160" rx="4" fill="#2f3f8f"/><circle cx="892" cy="236" r="7" fill="#6b7a3a"/><rect x="882" y="244" width="21" height="160" rx="4" fill="#6b7a3a"/><circle cx="808" cy="252" r="6" fill="#9b3b2b"/><rect x="799" y="259" width="18" height="128" rx="4" fill="#9b3b2b"/><circle cx="850" cy="263" r="12" fill="#b88a45"/><rect x="834" y="276" width="33" height="224" rx="4" fill="#b88a45"/></g><text x="943" y="183" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#5b3f2a" stroke-width="4">BELL BOARD</text><text x="943" y="353" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#8a6a45" stroke-width="4">PANEL</text><text x="1021" y="193" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#8a6a45" stroke-width="4">LOWER DOOR</text><text x="817" y="87" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#6f8fb8" stroke-width="4">HIGH WINDOW</text><text x="940" y="441" font-size="11" fill="#2f3f8f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BEARDED (back)</text><text x="892" y="430" font-size="11" fill="#6b7a3a" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">OLIVE</text><text x="808" y="401" font-size="11" fill="#9b3b2b" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">RUST</text><text x="850" y="514" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL (back)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">WIDE from the passage entrance.</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Board centre, lower door frame-RIGHT,</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">high window frame-LEFT.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH18 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">At the bell board Owen sets the pouch down and opens the lower panel (WS, 35mm)</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Service hall, VIEW A: from the passage entrance facing the board</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">They entered from the hall service door BEHIND the camera, so they move away from camera toward the board.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Same setup returns in SH21 (not consecutive, so it reads as the master of this scene).</text>
</svg>