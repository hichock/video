<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="866" viewBox="0 0 1160 866">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(20,40)"><rect x="0" y="0" width="660" height="760" fill="#efe8d8"/><rect x="40" y="40" width="620" height="110" fill="#cfc6b3" stroke="#1b2324" stroke-width="2"/><text x="350" y="90" font-size="20" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">MANOR FACADE (house)</text><rect x="290" y="110" width="80" height="40" fill="#ddd5c3" stroke="#1b2324"/><text x="330" y="136" font-size="13" fill="#1b2324" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">STEPS</text><rect x="315" y="142" width="30" height="8" fill="#5a3b22"/><text x="420" y="104" font-size="13" fill="#1b2324" text-anchor="start" font-weight="600" font-family="Arial, Helvetica, sans-serif">FRONT DOOR</text><rect x="190" y="300" width="70" height="140" rx="12" fill="#27402f" stroke="#1b2324" stroke-width="2"/><rect x="198" y="440" width="54" height="18" fill="#3b5a44" stroke="#1b2324"/><text x="225.0" y="375.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SUV</text><text x="225.0" y="292" font-size="12" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">nose</text><text x="225.0" y="428" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">tailgate</text><text x="225.0" y="442" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">OPEN ↓</text><circle cx="18" cy="420" r="14" fill="#f2b632"/><line x1="34" y1="420" x2="110" y2="420" stroke="#e0a020" stroke-width="4"/><polygon points="110,420 99.2,425.2 99.2,414.8" fill="#e0a020"/><text x="20" y="455" font-size="13" fill="#a0700a" text-anchor="start" font-weight="600" font-family="Arial, Helvetica, sans-serif">LOW SUN</text><text x="20" y="472" font-size="12" fill="#a0700a" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">= frame-RIGHT in this reverse view</text><line x1="520" y1="735" x2="620" y2="735" stroke="#667073" stroke-width="3"/><text x="570" y="728" font-size="12" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">≈ 4 m</text><polygon points="330,185 550,656 110,656" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><line x1="330" y1="185" x2="330" y2="165" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"/><polygon points="330,165 334.3,174.0 325.7,174.0" fill="#000000"/><g transform="translate(330,185) rotate(90)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="352" y="219" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 35mm, back to the house</text><line x1="305" y1="262" x2="305" y2="232" stroke="#5d93bd" stroke-width="3" stroke-dasharray="7 5"/><polygon points="305,232 310.2,242.8 299.8,242.8" fill="#5d93bd"/><circle cx="305" cy="232" r="11" fill="none" stroke="#5d93bd" stroke-width="2.5"/><circle cx="305" cy="262" r="13" fill="#5d93bd" stroke="#fff" stroke-width="2"/><line x1="305" y1="262" x2="305.0" y2="228.0" stroke="#5d93bd" stroke-width="5"/><polygon points="305.0,228.0 310.2,238.8 299.8,238.8" fill="#5d93bd"/><text x="55" y="256" font-size="12" fill="#5d93bd" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">COPPER HAIR, ICE-BLUE BLOUSE</text><text x="55" y="272" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">half a step ahead; points UP past</text><text x="55" y="287" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the camera at an upstairs window</text><line x1="362" y1="280" x2="362" y2="248" stroke="#b88a45" stroke-width="3" stroke-dasharray="7 5"/><polygon points="362,248 367.2,258.8 356.8,258.8" fill="#b88a45"/><circle cx="362" cy="248" r="11" fill="none" stroke="#b88a45" stroke-width="2.5"/><circle cx="362" cy="280" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="362" y1="280" x2="362.0" y2="246.0" stroke="#b88a45" stroke-width="5"/><polygon points="362.0,246.0 367.2,256.8 356.8,256.8" fill="#b88a45"/><text x="384" y="290" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="384" y="306" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">taller; listens,</text><text x="384" y="321" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">eyes follow her raised arm</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><rect x="760" y="60" width="300" height="213" fill="#efe8d8" fill-opacity="0.85" stroke="#1b2324"/><rect x="946" y="252" width="90" height="53" fill="#27402f" fill-opacity="0.85" stroke="#1b2324"/><circle cx="850" cy="167" r="21" fill="#b88a45"/><rect x="820" y="191" width="60" height="352" rx="4" fill="#b88a45"/><circle cx="970" cy="188" r="18" fill="#5d93bd"/><rect x="944" y="208" width="51" height="352" rx="4" fill="#5d93bd"/><text x="910" y="76" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#efe8d8" stroke-width="4">DRIVE, LAWNS (house is BEHIND camera)</text><text x="991" y="268" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#27402f" stroke-width="4">SUV (soft)</text><text x="850" y="556" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL (left)</text><text x="970" y="574" font-size="11" fill="#5d93bd" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">ICE-BLUE (right)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Tall woman on the LEFT, copper-haired</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">woman on the RIGHT half a step ahead,</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">arm raised above the lens. SUV behind</text><text x="760" y="681" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">them on frame-RIGHT. No house in frame.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH05 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="792" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">The two women walk to the front door; she points to a window</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Reverse view: camera backing toward the house ahead of them</text>
<text x="20" y="812" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Camera faces AWAY from the house: the tall woman is on frame-LEFT, the copper-haired woman on frame-RIGHT.</text><text x="20" y="830" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Both walk toward the camera. Eyes go above the lens, never into it.</text>
</svg>