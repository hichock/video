text><line x1="80" y1="265" x2="80" y2="345" stroke="#6f8fb8" stroke-width="7"/><text x="8" y="300" font-size="11" fill="#667073" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WINDOW</text><rect x="354" y="270" width="12" height="60" fill="#ffffff" stroke="#1b2324"/><path d="M360 270 A60 60 0 0 0 300 330" fill="none" stroke="#667073" stroke-dasharray="4 4"/><text x="300" y="262" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">NURSERY DOOR</text><rect x="86" y="390" width="62" height="200" rx="3" fill="#ffffff" stroke="#1b2324"/><text x="117" y="500" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">BED</text><text x="117" y="404" font-size="10" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">foot</text><rect x="86" y="592" width="34" height="24" fill="#b08a62" stroke="#1b2324"/><circle cx="103" cy="604" r="6" fill="#f2b632"/><text x="124" y="590" font-size="10" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">lamp</text><rect x="306" y="572" width="46" height="42" rx="6" fill="#ffffff" stroke="#1b2324"/><text x="329" y="566" font-size="10" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">armchair</text><rect x="170" y="360" width="160" height="200" fill="none" stroke="#667073" stroke-dasharray="5 4"/><rect x="215" y="430" width="60" height="40" fill="#5b3f2a" stroke="#1b2324"/><text x="245" y="455" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">CHEST</text><circle cx="92" cy="262" r="7" fill="#c1302a"/><text x="102" y="244" font-size="11" fill="#c1302a" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NURSERY FIXED corner</text><polygon points="400,200 606,622 194,622" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><line x1="400" y1="200" x2="400" y2="170" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"/><polygon points="400,170 404.3,179.0 395.7,179.0" fill="#000000"/><g transform="translate(400,200) rotate(90)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="422" y="234" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 35mm, backing north</text><line x1="380" y1="380" x2="380" y2="305" stroke="#5d93bd" stroke-width="3" stroke-dasharray="7 5"/><polygon points="380,305 385.2,315.8 374.8,315.8" fill="#5d93bd"/><circle cx="380" cy="305" r="11" fill="none" stroke="#5d93bd" stroke-width="2.5"/><circle cx="380" cy="380" r="13" fill="#5d93bd" stroke="#fff" stroke-width="2"/><line x1="380" y1="380" x2="380.0" y2="346.0" stroke="#5d93bd" stroke-width="5"/><polygon points="380.0,346.0 385.2,356.8 374.8,356.8" fill="#5d93bd"/><text x="90" y="210" font-size="12" fill="#5d93bd" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">COPPER HAIR, ICE-BLUE BLOUSE</text><text x="90" y="226" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">walks toward camera on the</text><text x="90" y="241" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">nursery-door side; slows at</text><text x="90" y="256" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the door and looks in</text><line x1="422" y1="390" x2="422" y2="315" stroke="#b88a45" stroke-width="3" stroke-dasharray="7 5"/><polygon points="422,315 427.2,325.8 416.8,325.8" fill="#b88a45"/><circle cx="422" cy="315" r="11" fill="none" stroke="#b88a45" stroke-width="2.5"/><circle cx="422" cy="390" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="422" y1="390" x2="422.0" y2="356.0" stroke="#b88a45" stroke-width="5"/><polygon points="422.0,356.0 427.2,366.8 416.8,366.8" fill="#b88a45"/><text x="448" y="430" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="448" y="446" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">taller, walks beside her,</text><text x="448" y="461" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">eyes on her</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><clipPath id="frameclip"><rect x="760" y="60" width="300" height="533"/></clipPath><g clip-path="url(#frameclip)"><rect x="850" y="124" width="120" height="181" fill="#efe7da" fill-opacity="0.85" stroke="#1b2324"/><rect x="1012" y="135" width="48" height="373" fill="#ffffff" fill-opacity="0.85" stroke="#1b2324"/><circle cx="886" cy="284" r="9" fill="#b88a45"/><rect x="872" y="295" width="27" height="192" rx="4" fill="#b88a45"/><circle cx="940" cy="295" r="8" fill="#5d93bd"/><rect x="928" y="304" width="24" height="176" rx="4" fill="#5d93bd"/></g><text x="910" y="140" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#efe7da" stroke-width="4">CORRIDOR → LANDING</text><text x="1036" y="151" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">DOOR: ALREADY OPEN</text><text x="886" y="517" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL (left)</text><text x="940" y="494" font-size="11" fill="#5d93bd" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">ICE-BLUE (right)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Looking back toward the landing.</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">The nursery door is ALREADY wide open on</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the RIGHT wall, a few steps AHEAD of the</text><text x="760" y="681" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">women (nearer camera). Nobody touches it.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH08 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">Naomi and Clara walk the upper corridor; Clara slows at the nursery door</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Reverse corridor view from the far-window end, looking south</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">The women came up the main stair and walk north toward the far window (and the camera).</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Copper-haired woman on frame-RIGHT = the door side (her left). Taller woman on frame-LEFT.</text><text x="20" y="884" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Script C2: “the OPEN nursery door” — it is already open in the start frame; nobody opens or touches it.</text>
</svg>