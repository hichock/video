end" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE DOOR</text><text x="585" y="452" font-size="12" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">→ service hall</text><line x1="60" y1="330" x2="60" y2="450" stroke="#6f8fb8" stroke-width="7"/><text x="70" y="322" font-size="12" fill="#667073" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WINDOW</text><polygon points="62,340 62,440 300,520 300,420" fill="#f2c14e" fill-opacity="0.35"/><text x="120" y="470" font-size="12" fill="#a0700a" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bar of low sun</text><rect x="90" y="560" width="70" height="46" rx="8" fill="#ffffff" stroke="#667073"/><text x="125" y="620" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">dust sheet</text><rect x="500" y="560" width="60" height="40" fill="#cdb895" stroke="#667073"/><text x="530" y="615" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">boxes</text><polygon points="250,670 -30,185 530,185" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><line x1="250" y1="670" x2="270" y2="600" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"/><polygon points="270,600 271.7,609.9 263.3,607.5" fill="#000000"/><g transform="translate(250,670) rotate(-90)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="70" y="630" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 35mm, low, just inside the door</text><line x1="548" y1="448" x2="548" y2="405" stroke="#2f3f8f" stroke-width="3" stroke-dasharray="7 5"/><line x1="548" y1="405" x2="430" y2="350" stroke="#2f3f8f" stroke-width="3" stroke-dasharray="7 5"/><polygon points="430,350 442.0,349.8 437.6,359.3" fill="#2f3f8f"/><circle cx="430" cy="350" r="11" fill="none" stroke="#2f3f8f" stroke-width="2.5"/><circle cx="548" cy="448" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="548" y1="448" x2="565.0" y2="418.5551362713291" stroke="#2f3f8f" stroke-width="5"/><polygon points="565.0,418.5551362713291 564.1,430.5 555.1,425.3" fill="#2f3f8f"/><text x="248" y="508" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="248" y="524" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">START: right beside the service door,</text><text x="248" y="539" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">RIGHT hand a hand’s width from the knob,</text><text x="248" y="554" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">case in LEFT hand, head turned right;</text><text x="248" y="569" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">tries the knob, then walks on</text><text x="248" y="584" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">AWAY toward the stair</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><rect x="760" y="167" width="42" height="171" fill="#6f8fb8" fill-opacity="0.85" stroke="#1b2324"/><rect x="850" y="113" width="120" height="240" fill="#d9cfbf" fill-opacity="0.85" stroke="#1b2324"/><rect x="1012" y="220" width="48" height="192" fill="#8a6a45" fill-opacity="0.85" stroke="#1b2324"/><circle cx="988" cy="220" r="16" fill="#2f3f8f"/><rect x="966" y="238" width="45" height="266" rx="4" fill="#2f3f8f"/><text x="781" y="183" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#6f8fb8" stroke-width="4">WINDOW</text><text x="910" y="129" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#d9cfbf" stroke-width="4">STAIR</text><text x="1036" y="236" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#8a6a45" stroke-width="4">SERVICE DOOR</text><text x="988" y="526" font-size="11" fill="#2f3f8f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BEARDED (back, head turned right)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Stair ahead, service door on the RIGHT wall.</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">He walks away from camera, right of centre,</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">and passes the service door on his right.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH06 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">Owen carries the heavy case in and checks the service door — VO 3</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Camera just inside the front door, looking into the hall</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Front door behind the camera. Service door on the RIGHT-hand wall (it leads to the service hall in SH17).</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Start frame: his right hand a hand’s width from the knob; the door is still closed.</text>
