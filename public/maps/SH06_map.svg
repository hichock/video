chor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Service door right beside the camera at the</text><text x="760" y="681" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">LEFT edge; his right hand goes to its knob.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH06 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
