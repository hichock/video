<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">NEW ANGLE: beside the service door, looking back at the front door</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Front door AHEAD of the camera (backlight). Stair BEHIND the camera — not in frame.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Start frame: his right hand a hand’s width from the knob; the door is still closed.</text>
