<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="902" viewBox="0 0 1160 902">
<rect width="100%" height="100%" fill="#ffffff"/>
<g transform="translate(20,40)"><rect x="0" y="0" width="660" height="760" fill="#e6e1d8"/><rect x="360" y="30" width="80" height="610" fill="#efe7da" stroke="#1b2324" stroke-width="2"/><rect x="385" y="50" width="30" height="570" fill="#b99a86" opacity="0.45"/><line x1="368" y1="30" x2="432" y2="30" stroke="#6f8fb8" stroke-width="7"/><text x="452" y="330" font-size="13" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">UPPER CORRIDOR</text><rect x="440" y="30" width="200" height="610" fill="#ddd6ca" stroke="#667073"/><rect x="436" y="120" width="8" height="40" fill="#8a6a45"/><rect x="436" y="380" width="8" height="40" fill="#8a6a45"/><rect x="436" y="520" width="8" height="40" fill="#8a6a45"/><text x="540" y="460" font-size="12" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">other rooms</text><rect x="80" y="30" width="280" height="220" fill="#ddd6ca" stroke="#667073"/><text x="220" y="140" font-size="12" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">other room</text><text x="355" y="22" font-size="12" fill="#1b2324" text-anchor="end" font-weight="700" font-family="Arial, Helvetica, sans-serif">FAR WINDOW (north) →</text><rect x="250" y="640" width="390" height="110" fill="#e0d6c4" stroke="#1b2324" stroke-width="2"/><text x="445" y="700" font-size="13" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">CENTRAL LANDING (south) — top of main stair</text><text x="445" y="718" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">monitor table + upper service door on its west wall</text><rect x="80" y="250" width="280" height="370" fill="#f4efe6" stroke="#1b2324" stroke-width="3"/><text x="220" y="606" font-size="16" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">NURSERY</text><line x1="80" y1="265" x2="80" y2="345" stroke="#6f8fb8" stroke-width="7"/><text x="8" y="300" font-size="11" fill="#667073" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WINDOW</text><rect x="354" y="270" width="12" height="60" fill="#ffffff" stroke="#1b2324"/><path d="M360 270 A60 60 0 0 0 300 330" fill="none" stroke="#667073" stroke-dasharray="4 4"/><text x="300" y="262" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">NURSERY DOOR</text><rect x="86" y="390" width="62" height="200" rx="3" fill="#ffffff" stroke="#1b2324"/><text x="117" y="500" font-size="12" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">BED</text><text x="117" y="404" font-size="10" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">foot</text><rect x="86" y="592" width="34" height="24" fill="#b08a62" stroke="#1b2324"/><circle cx="103" cy="604" r="6" fill="#f2b632"/><text x="124" y="590" font-size="10" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">lamp</text><rect x="306" y="572" width="46" height="42" rx="6" fill="#ffffff" stroke="#1b2324"/><text x="329" y="566" font-size="10" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">armchair</text><rect x="170" y="360" width="160" height="200" fill="none" stroke="#667073" stroke-dasharray="5 4"/><rect x="215" y="430" width="60" height="40" fill="#5b3f2a" stroke="#1b2324"/><text x="245" y="455" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">CHEST</text><circle cx="92" cy="262" r="7" fill="#c1302a"/><text x="102" y="244" font-size="11" fill="#c1302a" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NURSERY FIXED corner</text><polygon points="400,80 628,547 172,547" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><line x1="400" y1="80" x2="400" y2="55" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"/><polygon points="400,55 404.3,64.0 395.7,64.0" fill="#000000"/><g transform="translate(400,80) rotate(90)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="422" y="114" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 35mm, backing north</text><line x1="380" y1="190" x2="380" y2="140" stroke="#5d93bd" stroke-width="3" stroke-dasharray="7 5"/><polygon points="380,140 385.2,150.8 374.8,150.8" fill="#5d93bd"/><circle cx="380" cy="140" r="11" fill="none" stroke="#5d93bd" stroke-width="2.5"/><circle cx="380" cy="190" r="13" fill="#5d93bd" stroke="#fff" stroke-width="2"/><line x1="380" y1="190" x2="380.0" y2="156.0" stroke="#5d93bd" stroke-width="5"/><polygon points="380.0,156.0 385.2,166.8 374.8,166.8" fill="#5d93bd"/><text x="130" y="220" font-size="12" fill="#5d93bd" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">COPPER HAIR, ICE-BLUE BLOUSE</text><text x="130" y="236" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">door now ~2 m behind her;</text><text x="130" y="251" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">looks back once over her</text><text x="130" y="266" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">LEFT shoulder at the box</text><line x1="422" y1="200" x2="422" y2="150" stroke="#b88a45" stroke-width="3" stroke-dasharray="7 5"/><polygon points="422,150 427.2,160.8 416.8,160.8" fill="#b88a45"/><circle cx="422" cy="150" r="11" fill="none" stroke="#b88a45" stroke-width="2.5"/><circle cx="422" cy="200" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="422" y1="200" x2="422.0" y2="166.0" stroke="#b88a45" stroke-width="5"/><polygon points="422.0,166.0 427.2,176.8 416.8,176.8" fill="#b88a45"/><text x="448" y="240" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="448" y="256" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">follows her glance, then</text><text x="448" y="271" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">keeps pace, says nothing</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><rect x="874" y="135" width="72" height="160" fill="#efe7da" fill-opacity="0.85" stroke="#1b2324"/><rect x="970" y="177" width="30" height="160" fill="#ffffff" fill-opacity="0.85" stroke="#1b2324"/><circle cx="862" cy="145" r="19" fill="#b88a45"/><rect x="835" y="167" width="54" height="373" rx="4" fill="#b88a45"/><circle cx="958" cy="167" r="18" fill="#5d93bd"/><rect x="932" y="187" width="51" height="352" rx="4" fill="#5d93bd"/><text x="910" y="151" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#efe7da" stroke-width="4">LANDING (far)</text><text x="985" y="193" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">DOOR (behind them)</text><text x="862" y="554" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL (left)</text><text x="958" y="553" font-size="11" fill="#5d93bd" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">ICE-BLUE (right)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">The open door is now behind them on the</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">RIGHT wall. She glances back toward it</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">over her left shoulder.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH11 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">Clara: “Her last letter is in that box…”</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Same reverse corridor view, further toward the far window</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">They have passed the nursery door; they are now between the door and the far window.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Her glance back goes toward frame-right (the door), never into the lens.</text>
</svg>