end" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE DOOR</text><text x="585" y="452" font-size="12" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">→ service hall</text><line x1="60" y1="330" x2="60" y2="450" stroke="#6f8fb8" stroke-width="7"/><text x="70" y="322" font-size="12" fill="#667073" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WINDOW</text><polygon points="62,340 62,440 300,520 300,420" fill="#f2c14e" fill-opacity="0.35"/><text x="120" y="470" font-size="12" fill="#a0700a" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bar of low sun</text><rect x="90" y="560" width="70" height="46" rx="8" fill="#ffffff" stroke="#667073"/><text x="125" y="620" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">dust sheet</text><rect x="500" y="560" width="60" height="40" fill="#cdb895" stroke="#667073"/><text x="530" y="615" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">boxes</text><polygon points="372,500 137,93 607,93" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><g transform="translate(372,500) rotate(-90)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="42" y="610" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 24mm, behind his right shoulder</text><circle cx="392" cy="455" r="13" fill="#6b7a3a" stroke="#fff" stroke-width="2"/><line x1="392" y1="455" x2="389.03670474657963" y2="421.12938026488064" stroke="#6b7a3a" stroke-width="5"/><polygon points="389.03670474657963,421.12938026488064 395.2,431.4 384.8,432.3" fill="#6b7a3a"/><text x="418" y="449" font-size="12" fill="#6b7a3a" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL MAN, OLIVE JACKET</text><text x="418" y="465" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">right foreground, back to camera,</text><text x="418" y="480" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">handheld raised on the stair</text><circle cx="300" cy="200" r="13" fill="#5d93bd" stroke="#fff" stroke-width="2"/><line x1="300" y1="200" x2="300.0" y2="166.0" stroke="#5d93bd" stroke-width="5"/><polygon points="300.0,166.0 305.2,176.8 294.8,176.8" fill="#5d93bd"/><text x="50" y="110" font-size="12" fill="#5d93bd" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">COPPER HAIR, ICE-BLUE BLOUSE</text><text x="50" y="126" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">halfway up, LEFT,</text><text x="50" y="141" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">climbing away</text><circle cx="362" cy="210" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="362" y1="210" x2="362.0" y2="176.0" stroke="#b88a45" stroke-width="5"/><polygon points="362.0,176.0 367.2,186.8 356.8,186.8" fill="#b88a45"/><text x="388" y="190" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="388" y="206" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">halfway up, RIGHT, taller</text><circle cx="350" cy="338" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="350" y1="338" x2="350.0" y2="304.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="350.0,304.0 355.2,314.8 344.8,314.8" fill="#2f3f8f"/><text x="50" y="378" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="50" y="394" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">foot of the stair, right of</text><text x="50" y="409" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">centre; case in LEFT hand</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><clipPath id="frameclip"><rect x="760" y="60" width="300" height="533"/></clipPath><g clip-path="url(#frameclip)"><rect x="820" y="81" width="168" height="298" fill="#d9cfbf" fill-opacity="0.85" stroke="#1b2324"/><rect x="760" y="177" width="30" height="160" fill="#6f8fb8" fill-opacity="0.85" stroke="#1b2324"/><rect x="1030" y="220" width="30" height="181" fill="#8a6a45" fill-opacity="0.85" stroke="#1b2324"/><circle cx="880" cy="167" r="5" fill="#5d93bd"/><rect x="873" y="172" width="14" height="69" rx="4" fill="#5d93bd"/><circle cx="922" cy="156" r="5" fill="#b88a45"/><rect x="914" y="162" width="15" height="80" rx="4" fill="#b88a45"/><circle cx="928" cy="295" r="8" fill="#2f3f8f"/><rect x="916" y="304" width="24" height="107" rx="4" fill="#2f3f8f"/><circle cx="1000" cy="241" r="31" fill="#6b7a3a"/><rect x="955" y="277" width="90" height="362" rx="4" fill="#6b7a3a"/></g><text x="904" y="97" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#d9cfbf" stroke-width="4">STAIR (going up, away)</text><text x="775" y="193" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#6f8fb8" stroke-width="4">WINDOW</text><text x="1045" y="236" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#8a6a45" stroke-width="4">SERVICE DOOR</text><text x="880" y="255" font-size="11" fill="#5d93bd" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">ICE-BLUE</text><text x="922" y="256" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL</text><text x="928" y="425" font-size="11" fill="#2f3f8f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BEARDED</text><text x="1000" y="514" font-size="11" fill="#6b7a3a" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">OLIVE (back, handheld up)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">FIRST FRAME. Looking UP the stair; the</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">front door is behind the camera (SH06</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">looked the other way). Women climb</text><text x="760" y="681" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">away; tall man in the right foreground.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH07 — FIRST FRAME ONLY: start positions and facing — not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">First frame: behind the tall man, looking up the stair; the women halfway up (WS, 24mm)</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Mid-hall, looking north up the stair</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Opposite direction to SH06, so the cut reads as a new view.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">The small woman walks in from behind the camera on the left only during the video.</text>
</svg>