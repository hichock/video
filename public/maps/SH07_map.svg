end" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE DOOR</text><text x="585" y="452" font-size="12" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">→ service hall</text><line x1="60" y1="330" x2="60" y2="450" stroke="#6f8fb8" stroke-width="7"/><text x="70" y="322" font-size="12" fill="#667073" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WINDOW</text><polygon points="62,340 62,440 300,520 300,420" fill="#f2c14e" fill-opacity="0.35"/><text x="120" y="470" font-size="12" fill="#a0700a" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bar of low sun</text><rect x="90" y="560" width="70" height="46" rx="8" fill="#ffffff" stroke="#667073"/><text x="125" y="620" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">dust sheet</text><rect x="500" y="560" width="60" height="40" fill="#cdb895" stroke="#667073"/><text x="530" y="615" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">boxes</text><polygon points="460,590 198,118 722,118" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><line x1="460" y1="590" x2="460" y2="520" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"/><polygon points="460,520 464.3,529.0 455.7,529.0" fill="#000000"/><g transform="translate(460,590) rotate(-90)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="130" y="680" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 24mm, over his right shoulder, rises</text><circle cx="420" cy="540" r="13" fill="#6b7a3a" stroke="#fff" stroke-width="2"/><line x1="420" y1="540" x2="417.03670474657963" y2="506.12938026488064" stroke="#6b7a3a" stroke-width="5"/><polygon points="417.03670474657963,506.12938026488064 423.2,516.4 412.8,517.3" fill="#6b7a3a"/><text x="120" y="530" font-size="12" fill="#6b7a3a" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL MAN, OLIVE JACKET</text><text x="120" y="546" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">frames the stair with the handheld</text><text x="120" y="561" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">(camera up, visible past his shoulder)</text><line x1="305" y1="190" x2="305" y2="110" stroke="#5d93bd" stroke-width="3" stroke-dasharray="7 5"/><polygon points="305,110 310.2,120.8 299.8,120.8" fill="#5d93bd"/><circle cx="305" cy="110" r="11" fill="none" stroke="#5d93bd" stroke-width="2.5"/><circle cx="305" cy="190" r="13" fill="#5d93bd" stroke="#fff" stroke-width="2"/><line x1="305" y1="190" x2="305.0" y2="156.0" stroke="#5d93bd" stroke-width="5"/><polygon points="305.0,156.0 310.2,166.8 299.8,166.8" fill="#5d93bd"/><text x="115" y="190" font-size="12" fill="#5d93bd" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">COPPER HAIR, ICE-BLUE BLOUSE</text><text x="115" y="206" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">climbing, left of the pair</text><line x1="360" y1="200" x2="360" y2="120" stroke="#b88a45" stroke-width="3" stroke-dasharray="7 5"/><polygon points="360,120 365.2,130.8 354.8,130.8" fill="#b88a45"/><circle cx="360" cy="120" r="11" fill="none" stroke="#b88a45" stroke-width="2.5"/><circle cx="360" cy="200" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="360" y1="200" x2="360.0" y2="166.0" stroke="#b88a45" stroke-width="5"/><polygon points="360.0,166.0 365.2,176.8 354.8,176.8" fill="#b88a45"/><text x="382" y="210" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="382" y="226" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">climbing, right of the pair</text><line x1="330" y1="350" x2="330" y2="280" stroke="#2f3f8f" stroke-width="3" stroke-dasharray="7 5"/><polygon points="330,280 335.2,290.8 324.8,290.8" fill="#2f3f8f"/><circle cx="330" cy="280" r="11" fill="none" stroke="#2f3f8f" stroke-width="2.5"/><circle cx="330" cy="350" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="330" y1="350" x2="330.0" y2="316.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="330.0,316.0 335.2,326.8 324.8,326.8" fill="#2f3f8f"/><text x="50" y="360" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="50" y="376" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">starts up the stair behind them</text><line x1="300" y1="650" x2="305" y2="420" stroke="#9b3b2b" stroke-width="3" stroke-dasharray="7 5"/><polygon points="305,420 310.0,430.9 299.5,430.7" fill="#9b3b2b"/><circle cx="305" cy="420" r="11" fill="none" stroke="#9b3b2b" stroke-width="2.5"/><circle cx="300" cy="650" r="13" fill="#9b3b2b" stroke="#fff" stroke-width="2"/><line x1="300" y1="650" x2="300.0" y2="616.0" stroke="#9b3b2b" stroke-width="5"/><polygon points="300.0,616.0 305.2,626.8 294.8,626.8" fill="#9b3b2b"/><text x="60" y="650" font-size="12" fill="#9b3b2b" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL WOMAN, RUST VEST</text><text x="60" y="666" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">comes in from the front door</text><text x="60" y="681" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">with her compact case</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><rect x="826" y="71" width="168" height="320" fill="#d9cfbf" fill-opacity="0.85" stroke="#1b2324"/><circle cx="880" cy="151" r="5" fill="#5d93bd"/><rect x="872" y="157" width="15" height="64" rx="4" fill="#5d93bd"/><circle cx="919" cy="135" r="6" fill="#b88a45"/><rect x="911" y="141" width="16" height="75" rx="4" fill="#b88a45"/><circle cx="904" cy="284" r="9" fill="#2f3f8f"/><rect x="890" y="295" width="27" height="107" rx="4" fill="#2f3f8f"/><circle cx="790" cy="412" r="8" fill="#9b3b2b"/><rect x="778" y="421" width="24" height="117" rx="4" fill="#9b3b2b"/><circle cx="1012" cy="252" r="29" fill="#6b7a3a"/><rect x="970" y="285" width="84" height="277" rx="4" fill="#6b7a3a"/><text x="910" y="87" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#d9cfbf" stroke-width="4">STAIR (camera tilts up it)</text><text x="880" y="235" font-size="11" fill="#5d93bd" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">ICE-BLUE</text><text x="919" y="230" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL</text><text x="904" y="415" font-size="11" fill="#2f3f8f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BEARDED (back)</text><text x="790" y="553" font-size="11" fill="#9b3b2b" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">RUST</text><text x="1012" y="467" font-size="11" fill="#6b7a3a" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">OLIVE (back)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Tall man in the right foreground, back to camera,</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">camera raised. Women halfway up the stair,</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bearded man at its foot, small woman lower-left.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH07 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">Elias frames the stair; Naomi and Clara go up; Mara and Owen follow</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Camera in the hall behind the tall man’s right shoulder</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Front door behind the camera. The camera rises past his shoulder and follows the two women up the stair.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Owen continues from SH06: already at the stair foot, not coming in again.</text>
</svg>