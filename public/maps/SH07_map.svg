end" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE DOOR</text><text x="585" y="452" font-size="12" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">→ service hall</text><line x1="60" y1="330" x2="60" y2="450" stroke="#6f8fb8" stroke-width="7"/><text x="70" y="322" font-size="12" fill="#667073" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WINDOW</text><polygon points="62,340 62,440 300,520 300,420" fill="#f2c14e" fill-opacity="0.35"/><text x="120" y="470" font-size="12" fill="#a0700a" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bar of low sun</text><rect x="90" y="560" width="70" height="46" rx="8" fill="#ffffff" stroke="#667073"/><text x="125" y="620" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">dust sheet</text><rect x="500" y="560" width="60" height="40" fill="#cdb895" stroke="#667073"/><text x="530" y="615" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">boxes</text><polygon points="330,80 640,617 20,617" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><g transform="translate(330,80) rotate(90)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="420" y="74" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 24mm, HIGH</text><line x1="355" y1="190" x2="355" y2="110" stroke="#5d93bd" stroke-width="3" stroke-dasharray="7 5"/><polygon points="355,110 360.2,120.8 349.8,120.8" fill="#5d93bd"/><circle cx="355" cy="110" r="11" fill="none" stroke="#5d93bd" stroke-width="2.5"/><circle cx="355" cy="190" r="13" fill="#5d93bd" stroke="#fff" stroke-width="2"/><line x1="355" y1="190" x2="355.0" y2="156.0" stroke="#5d93bd" stroke-width="5"/><polygon points="355.0,156.0 360.2,166.8 349.8,166.8" fill="#5d93bd"/><text x="381" y="190" font-size="12" fill="#5d93bd" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">COPPER HAIR, ICE-BLUE BLOUSE</text><text x="381" y="206" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">climbing TOWARD camera,</text><text x="381" y="221" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">frame-RIGHT of the pair</text><line x1="305" y1="200" x2="305" y2="120" stroke="#b88a45" stroke-width="3" stroke-dasharray="7 5"/><polygon points="305,120 310.2,130.8 299.8,130.8" fill="#b88a45"/><circle cx="305" cy="120" r="11" fill="none" stroke="#b88a45" stroke-width="2.5"/><circle cx="305" cy="200" r="13" fill="#b88a45" stroke="#fff" stroke-width="2"/><line x1="305" y1="200" x2="305.0" y2="166.0" stroke="#b88a45" stroke-width="5"/><polygon points="305.0,166.0 310.2,176.8 299.8,176.8" fill="#b88a45"/><text x="55" y="110" font-size="12" fill="#b88a45" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL WOMAN, CAMEL COAT</text><text x="55" y="126" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">climbing TOWARD camera,</text><text x="55" y="141" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">frame-LEFT, taller</text><line x1="330" y1="330" x2="330" y2="270" stroke="#2f3f8f" stroke-width="3" stroke-dasharray="7 5"/><polygon points="330,270 335.2,280.8 324.8,280.8" fill="#2f3f8f"/><circle cx="330" cy="270" r="11" fill="none" stroke="#2f3f8f" stroke-width="2.5"/><circle cx="330" cy="330" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="330" y1="330" x2="330.0" y2="296.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="330.0,296.0 335.2,306.8 324.8,306.8" fill="#2f3f8f"/><text x="356" y="290" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="356" y="306" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">at the stair foot, starts up</text><circle cx="300" cy="450" r="13" fill="#6b7a3a" stroke="#fff" stroke-width="2"/><line x1="300" y1="450" x2="300.0" y2="416.0" stroke="#6b7a3a" stroke-width="5"/><polygon points="300.0,416.0 305.2,426.8 294.8,426.8" fill="#6b7a3a"/><text x="326" y="490" font-size="12" fill="#6b7a3a" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">TALL MAN, OLIVE JACKET</text><text x="326" y="506" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">in the hall, handheld raised</text><text x="326" y="521" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">toward the stair</text><line x1="330" y1="670" x2="330" y2="600" stroke="#9b3b2b" stroke-width="3" stroke-dasharray="7 5"/><polygon points="330,600 335.2,610.8 324.8,610.8" fill="#9b3b2b"/><circle cx="330" cy="600" r="11" fill="none" stroke="#9b3b2b" stroke-width="2.5"/><circle cx="330" cy="670" r="13" fill="#9b3b2b" stroke="#fff" stroke-width="2"/><line x1="330" y1="670" x2="330.0" y2="636.0" stroke="#9b3b2b" stroke-width="5"/><polygon points="330.0,636.0 335.2,646.8 324.8,646.8" fill="#9b3b2b"/><text x="356" y="660" font-size="12" fill="#9b3b2b" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL WOMAN, RUST VEST</text><text x="356" y="676" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">just coming in at the front door</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><clipPath id="frameclip"><rect x="760" y="60" width="300" height="533"/></clipPath><g clip-path="url(#frameclip)"><rect x="820" y="326" width="180" height="266" fill="#d9cfbf" fill-opacity="0.85" stroke="#1b2324"/><rect x="880" y="92" width="60" height="75" fill="#fff6d8" fill-opacity="0.85" stroke="#1b2324"/><rect x="760" y="167" width="36" height="107" fill="#8a6a45" fill-opacity="0.85" stroke="#1b2324"/><rect x="1018" y="156" width="42" height="128" fill="#6f8fb8" fill-opacity="0.85" stroke="#1b2324"/><circle cx="880" cy="209" r="5" fill="#6b7a3a"/><rect x="877" y="212" width="6" height="27" rx="4" fill="#6b7a3a"/><circle cx="910" cy="124" r="5" fill="#9b3b2b"/><rect x="908" y="126" width="4" height="19" rx="4" fill="#9b3b2b"/><circle cx="910" cy="284" r="5" fill="#2f3f8f"/><rect x="904" y="289" width="12" height="43" rx="4" fill="#2f3f8f"/><circle cx="868" cy="369" r="10" fill="#b88a45"/><rect x="853" y="381" width="30" height="160" rx="4" fill="#b88a45"/><circle cx="952" cy="380" r="9" fill="#5d93bd"/><rect x="938" y="391" width="27" height="144" rx="4" fill="#5d93bd"/></g><text x="910" y="342" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#d9cfbf" stroke-width="4">STAIR (looking down it)</text><text x="910" y="108" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#fff6d8" stroke-width="4">FRONT DOOR</text><text x="778" y="183" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#8a6a45" stroke-width="4">SERVICE DOOR</text><text x="1039" y="172" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#6f8fb8" stroke-width="4">WINDOW</text><text x="880" y="252" font-size="11" fill="#6b7a3a" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">OLIVE</text><text x="910" y="154" font-size="11" fill="#9b3b2b" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">RUST</text><text x="910" y="283" font-size="11" fill="#2f3f8f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BEARDED</text><text x="868" y="555" font-size="11" fill="#b88a45" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">CAMEL</text><text x="952" y="549" font-size="11" fill="#5d93bd" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">ICE-BLUE</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">WIDE, HIGH ANGLE from the top of the stair.</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Women climb TOWARD camera (faces seen).</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Everyone else small below in the hall.</text><text x="760" y="681" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Service door LEFT wall, window RIGHT.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH07 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">Naomi and Clara go up; the crew follow below (WS, 24mm, high)</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">NEW ANGLE: top of the central stair, looking down into the hall</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Reverse of SH06: from up here the front door is at the far end and the service door is on the LEFT wall.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Owen continues from SH06: already at the stair foot, not coming in again.</text>
