8a6a45" stroke="#1b2324"/><text x="582" y="526" font-size="12" fill="#1b2324" text-anchor="end" font-weight="700" font-family="Arial, Helvetica, sans-serif">LOWER SERVICE DOOR</text><text x="582" y="542" font-size="11" fill="#667073" text-anchor="end" font-weight="400" font-family="Arial, Helvetica, sans-serif">→ back stair</text><circle cx="566" cy="336" r="5" fill="#f2b632"/><text x="330" y="640" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">the lower wooden panel is under the board at knee height</text><text x="330" y="656" font-size="11" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">night: one bare bulb above the board</text><polygon points="230,380 593,211 593,549" fill="#1f5fa8" fill-opacity="0.08" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="8 5"/><g transform="translate(230,380) rotate(0)"><rect x="-18" y="-13" width="30" height="26" rx="3" fill="#1f5fa8"/><polygon points="12,-9 26,-15 26,15 12,9" fill="#1f5fa8"/></g><text x="240" y="490" font-size="14" fill="#1f5fa8" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">VIEW A — facing the board</text><polygon points="560,380 179,557 179,203" fill="#c0501f" fill-opacity="0.08" stroke="#c0501f" stroke-width="2" stroke-dasharray="8 5"/><g transform="translate(560,380) rotate(180)"><rect x="-18" y="-13" width="30" height="26" rx="3" fill="#c0501f"/><polygon points="12,-9 26,-15 26,15 12,9" fill="#c0501f"/></g><text x="220" y="570" font-size="14" fill="#c0501f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">VIEW B — back to the board</text><line x1="230" y1="380" x2="256" y2="380" stroke="#1f5fa8" stroke-width="4"/><circle cx="230" cy="380" r="12" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="230" y="384" font-size="11" fill="#1f5fa8" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">18</text><line x1="540" y1="392" x2="565" y2="397" stroke="#1f5fa8" stroke-width="4"/><circle cx="540" cy="392" r="12" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="540" y="396" font-size="11" fill="#1f5fa8" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">19</text><line x1="520" y1="414" x2="545" y2="409" stroke="#1f5fa8" stroke-width="4"/><circle cx="520" cy="414" r="12" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="520" y="418" font-size="11" fill="#1f5fa8" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">20</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">THE 2×2 LOCATION SHEET (one image)</text><rect x="760" y="60" width="140" height="249" fill="#f6efd9" stroke="#1b2324" stroke-width="2"/><text x="768" y="80" font-size="12" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">DAY · VIEW A</text><text x="768" y="104" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bell board centre</text><text x="768" y="120" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">lower door RIGHT</text><text x="768" y="136" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">high window LEFT</text><text x="768" y="152" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">cold shaft of light</text><rect x="912" y="60" width="140" height="249" fill="#f6efd9" stroke="#1b2324" stroke-width="2"/><text x="920" y="80" font-size="12" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">DAY · VIEW B</text><text x="920" y="104" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">passage to the hall</text><text x="920" y="120" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">door open, bright</text><text x="920" y="136" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">high window RIGHT</text><text x="920" y="152" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">board behind camera</text><rect x="760" y="321" width="140" height="249" fill="#27303a" stroke="#1b2324" stroke-width="2"/><text x="768" y="341" font-size="12" fill="#f3ead8" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NIGHT · VIEW A</text><text x="768" y="365" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">same framing</text><text x="768" y="381" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bare bulb above</text><text x="768" y="397" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the board, lit</text><text x="768" y="413" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">walls fall dark</text><rect x="912" y="321" width="140" height="249" fill="#27303a" stroke="#1b2324" stroke-width="2"/><text x="920" y="341" font-size="12" fill="#f3ead8" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NIGHT · VIEW B</text><text x="920" y="365" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">same framing</text><text x="920" y="381" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">hall door CLOSED</text><text x="920" y="397" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">bulb spill from</text><text x="920" y="413" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">behind camera</text><text x="760" y="600" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">View A: SH18, SH21 (WS), SH19 (INSERT),</text><text x="760" y="617" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">SH20 (MS).</text><text x="760" y="634" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">View B: not used yet — for entrances later.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SERVICE HALL — LOCATION MAP: view A, view B (180°), light, and every shot setup</text>
