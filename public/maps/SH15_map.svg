<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">First frame: bearded man just past the door, walking at camera (MS, 50mm)</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">NEW ANGLE: in the corridor south of the door, looking north</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Frontal medium after the side-on wide of SH14: walking toward the landing = toward this camera.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Nobody has turned their head yet.</text>
