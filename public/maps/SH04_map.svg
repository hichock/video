<g transform="translate(20,40)"><rect x="0" y="0" width="660" height="760" fill="#efe8d8"/><rect x="40" y="40" width="620" height="110" fill="#cfc6b3" stroke="#1b2324" stroke-width="2"/><text x="350" y="90" font-size="20" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">MANOR FACADE (house)</text><rect x="290" y="110" width="80" height="40" fill="#ddd5c3" stroke="#1b2324"/><text x="330" y="136" font-size="13" fill="#1b2324" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">STEPS</text><rect x="315" y="142" width="30" height="8" fill="#5a3b22"/><text x="420" y="104" font-size="13" fill="#1b2324" text-anchor="start" font-weight="600" font-family="Arial, Helvetica, sans-serif">FRONT DOOR</text><rect x="190" y="300" width="70" height="140" rx="12" fill="#27402f" stroke="#1b2324" stroke-width="2"/><rect x="198" y="440" width="54" height="18" fill="#3b5a44" stroke="#1b2324"/><text x="225.0" y="375.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">SUV</text><text x="225.0" y="292" font-size="12" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">nose</text><text x="225.0" y="428" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">tailgate</text><text x="225.0" y="442" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">OPEN ↓</text><circle cx="18" cy="420" r="14" fill="#f2b632"/><line x1="34" y1="420" x2="110" y2="420" stroke="#e0a020" stroke-width="4"/><polygon points="110,420 99.2,425.2 99.2,414.8" fill="#e0a020"/><text x="20" y="455" font-size="13" fill="#a0700a" text-anchor="start" font-weight="600" font-family="Arial, Helvetica, sans-serif">LOW SUN</text><text x="20" y="472" font-size="12" fill="#a0700a" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">= AHEAD of camera (backlight)</text><line x1="520" y1="735" x2="620" y2="735" stroke="#667073" stroke-width="3"/><text x="570" y="728" font-size="12" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">≈ 4 m</text><polygon points="420,470 127,622 127,318" fill="#000000" fill-opacity="0.07" stroke="#000" stroke-opacity="0.35" stroke-dasharray="6 5"/><line x1="420" y1="470" x2="420" y2="430" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"/><polygon points="420,430 424.3,439.0 415.7,439.0" fill="#000000"/><g transform="translate(420,470) rotate(180)"><rect x="-16" y="-11" width="26" height="22" rx="3" fill="#111"/><polygon points="10,-8 22,-13 22,13 10,8" fill="#111"/></g><text x="442" y="504" font-size="13" fill="#000" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">CAMERA 50mm, side-on to the SUV</text><line x1="238" y1="478" x2="292" y2="478" stroke="#9b3b2b" stroke-width="3" stroke-dasharray="7 5"/><line x1="292" y1="478" x2="292" y2="300" stroke="#9b3b2b" stroke-width="3" stroke-dasharray="7 5"/><polygon points="292,300 297.2,310.8 286.8,310.8" fill="#9b3b2b"/><circle cx="292" cy="300" r="11" fill="none" stroke="#9b3b2b" stroke-width="2.5"/><circle cx="238" cy="478" r="13" fill="#9b3b2b" stroke="#fff" stroke-width="2"/><line x1="238" y1="478" x2="238.0" y2="444.0" stroke="#9b3b2b" stroke-width="5"/><polygon points="238.0,444.0 243.2,454.8 232.8,454.8" fill="#9b3b2b"/><text x="228" y="542" font-size="12" fill="#9b3b2b" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SMALL WOMAN, RUST VEST</text><text x="228" y="558" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">faces INTO the boot (frame-right),</text><text x="228" y="573" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">lifts the case out, then walks along</text><text x="228" y="588" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">the camera side of the SUV</text><text x="228" y="603" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">toward the house (frame-right)</text><circle cx="196" cy="500" r="13" fill="#2f3f8f" stroke="#fff" stroke-width="2"/><line x1="196" y1="500" x2="196.0" y2="466.0" stroke="#2f3f8f" stroke-width="5"/><polygon points="196.0,466.0 201.2,476.8 190.8,476.8" fill="#2f3f8f"/><text x="21" y="534" font-size="12" fill="#2f3f8f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">BIG BEARDED MAN, INDIGO</text><text x="21" y="550" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">left edge, partly cut off</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">WHAT THE CAMERA SEES (9:16)</text><rect x="760" y="60" width="300" height="533" fill="#ffffff" stroke="#1b2324" stroke-width="2"/><line x1="860" y1="60" x2="860" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><line x1="960" y1="60" x2="960" y2="593" stroke="#c8cccd" stroke-dasharray="4 4"/><text x="810.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">LEFT</text><text x="910.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">CENTRE</text><text x="1010.0" y="611" font-size="11" fill="#667073" text-anchor="middle" font-weight="600" font-family="Arial, Helvetica, sans-serif">RIGHT</text><rect x="925" y="87" width="135" height="187" fill="#cfc6b3" fill-opacity="0.85" stroke="#1b2324"/><rect x="760" y="263" width="300" height="160" fill="#27402f" fill-opacity="0.85" stroke="#1b2324"/><circle cx="775" cy="273" r="10" fill="#2f3f8f"/><rect x="760" y="285" width="30" height="213" rx="4" fill="#2f3f8f"/><circle cx="868" cy="220" r="17" fill="#9b3b2b"/><rect x="844" y="239" width="48" height="266" rx="4" fill="#9b3b2b"/><text x="992" y="103" font-size="11" fill="#1b2324" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#cfc6b3" stroke-width="4">MANOR + STEPS (soft)</text><text x="910" y="279" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#27402f" stroke-width="4">SUV side-on: REAR/open boot LEFT, nose RIGHT</text><text x="775" y="512" font-size="11" fill="#2f3f8f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">BEARDED</text><text x="868" y="542" font-size="11" fill="#9b3b2b" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif" paint-order="stroke" stroke="#ffffff" stroke-width="4">RUST (profile, facing right)</text><text x="760" y="633" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Open boot on frame-LEFT, nose toward the</text><text x="760" y="649" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">house on frame-RIGHT. Low sun ahead:</text><text x="760" y="665" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">she is backlit. She exits frame-RIGHT.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">SH04 — TOP-DOWN PLAN: positions and directions only, not an image to copy</text>
<text x="20" y="792" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">The small woman lifts the camera case, checks the latch — VO 2</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Camera on the east side of the SUV looking across it (west)</text>
<text x="20" y="812" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Case STILL INSIDE the boot in the start frame → she lifts it out, then walks toward the house along the camera side of the SUV.</text><text x="20" y="830" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Screen direction: toward the house = frame-RIGHT in this shot.</text>
</svg>