Helvetica, sans-serif">A: from the LEFT · B: from the RIGHT</text><line x1="520" y1="735" x2="620" y2="735" stroke="#667073" stroke-width="3"/><text x="570" y="728" font-size="12" fill="#667073" text-anchor="middle" font-weight="400" font-family="Arial, Helvetica, sans-serif">≈ 4 m</text><polygon points="225,690 -75,125 525,125" fill="#1f5fa8" fill-opacity="0.08" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="8 5"/><g transform="translate(225,690) rotate(-90)"><rect x="-18" y="-13" width="30" height="26" rx="3" fill="#1f5fa8"/><polygon points="12,-9 26,-15 26,15 12,9" fill="#1f5fa8"/></g><text x="25" y="730" font-size="14" fill="#1f5fa8" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">VIEW A — at the SUV, looking at the house</text><polygon points="330,200 584,677 76,677" fill="#c0501f" fill-opacity="0.08" stroke="#c0501f" stroke-width="2" stroke-dasharray="8 5"/><g transform="translate(330,200) rotate(90)"><rect x="-18" y="-13" width="30" height="26" rx="3" fill="#c0501f"/><polygon points="12,-9 26,-15 26,15 12,9" fill="#c0501f"/></g><text x="360" y="230" font-size="14" fill="#c0501f" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">VIEW B — back to the house, looking out</text><circle cx="392" cy="140" r="8" fill="#f2b632" stroke="#8a5a00" stroke-width="2"/><text x="402" y="144" font-size="11" fill="#8a5a00" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">night: door lantern</text><line x1="300" y1="690" x2="300" y2="664" stroke="#1f5fa8" stroke-width="4"/><circle cx="300" cy="690" r="12" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="300" y="694" font-size="11" fill="#1f5fa8" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">02</text><line x1="420" y1="470" x2="394" y2="470" stroke="#1f5fa8" stroke-width="4"/><circle cx="420" cy="470" r="12" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="420" y="474" font-size="11" fill="#1f5fa8" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">04</text><line x1="330" y1="185" x2="330" y2="211" stroke="#c0501f" stroke-width="4"/><circle cx="330" cy="185" r="12" fill="#ffffff" stroke="#c0501f" stroke-width="3"/><text x="330" y="189" font-size="11" fill="#c0501f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">03</text><line x1="330" y1="185" x2="330" y2="211" stroke="#c0501f" stroke-width="4"/><circle cx="330" cy="185" r="12" fill="#ffffff" stroke="#c0501f" stroke-width="3"/><text x="330" y="189" font-size="11" fill="#c0501f" text-anchor="middle" font-weight="700" font-family="Arial, Helvetica, sans-serif">05</text><text x="760" y="48" font-size="15" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">THE 2×2 LOCATION SHEET (one image)</text><rect x="760" y="60" width="140" height="249" fill="#f6efd9" stroke="#1b2324" stroke-width="2"/><text x="768" y="80" font-size="12" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">DAY · VIEW A</text><text x="768" y="104" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">facade, steps centre</text><text x="768" y="120" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">SUV rear, tailgate</text><text x="768" y="136" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">open toward camera</text><text x="768" y="152" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">sun from LEFT</text><rect x="912" y="60" width="140" height="249" fill="#f6efd9" stroke="#1b2324" stroke-width="2"/><text x="920" y="80" font-size="12" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">DAY · VIEW B</text><text x="920" y="104" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">house behind camera</text><text x="920" y="120" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">SUV seen from FRONT</text><text x="920" y="136" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">drive curves away</text><text x="920" y="152" font-size="11" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">sun from RIGHT</text><rect x="760" y="321" width="140" height="249" fill="#27303a" stroke="#1b2324" stroke-width="2"/><text x="768" y="341" font-size="12" fill="#f3ead8" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NIGHT · VIEW A</text><text x="768" y="365" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">same framing</text><text x="768" y="381" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">door lantern lit</text><text x="768" y="397" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">2 windows glow warm</text><text x="768" y="413" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">blue night sky</text><rect x="912" y="321" width="140" height="249" fill="#27303a" stroke="#1b2324" stroke-width="2"/><text x="920" y="341" font-size="12" fill="#f3ead8" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">NIGHT · VIEW B</text><text x="920" y="365" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">same framing</text><text x="920" y="381" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">cool moon from RIGHT</text><text x="920" y="397" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">warm spill from the</text><text x="920" y="413" font-size="11" fill="#f3ead8" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">house behind camera</text><text x="760" y="600" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">View A: SH02 (EWS), SH04 (MCU, side-on).</text><text x="760" y="617" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">View B: SH03, SH05 (reverse, tracking).</text><text x="760" y="634" font-size="12" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Master plate = day A. Reverse plate = day B.</text></g>
<text x="20" y="26" font-size="16" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">EXTERIOR — LOCATION MAP: view A, view B (180°), light, and every shot setup</text>
<text x="20" y="826" font-size="14" fill="#1b2324" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif">Exterior — arrival</text>
<text x="760" y="26" font-size="12" fill="#667073" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">Two opposite views of the drive, day and night</text>
<text x="20" y="848" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">The sun is on the LEFT of view A, so it is on the RIGHT of view B — never the same side in both.</text><text x="20" y="866" font-size="13" fill="#1b2324" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif">The house is always ahead of anyone walking to it; the SUV is always behind them.</text>
</svg>